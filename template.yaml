AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: opencertcraft backend - Phase 1 identity (Cognito User Pool)

Parameters:
  SiteCustomDomain:
    Type: String
    Description: Custom domain served by the CloudFront site (must be covered by SiteCertificateArn)
  SiteCertificateArn:
    Type: String
    Description: ARN of an ACM certificate in us-east-1 covering SiteCustomDomain

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cert-quizz-maker-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailVerificationSubject: 'Your Certification Quiz Maker verification code'
      EmailVerificationMessage: 'Your Certification Quiz Maker verification code is {####}'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: cert-quizz-maker-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  SyncTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cert-quizz-maker-sync
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SyncApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoAuthorizer
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${SiteCustomDomain}
          - !Sub https://www.${SiteCustomDomain}
          - http://localhost:5173
          - http://localhost:4173
        AllowMethods:
          - GET
          - PUT
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  PullFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/lambda/pull/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Environment:
        Variables:
          TABLE_NAME: !Ref SyncTable
      Events:
        PullSync:
          Type: HttpApi
          Properties:
            ApiId: !Ref SyncApi
            Method: GET
            Path: /sync
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SyncTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - index.ts

  PushFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/lambda/push/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Environment:
        Variables:
          TABLE_NAME: !Ref SyncTable
      Events:
        PushSync:
          Type: HttpApi
          Properties:
            ApiId: !Ref SyncApi
            Method: PUT
            Path: /sync
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt SyncTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - index.ts

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cert-quizz-maker-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LegacyRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-legacy-domain-redirect
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          if (host === 'quiz-cert.com' || host === 'www.quiz-cert.com') {
            var location = 'https://${SiteCustomDomain}' + request.uri;
            var params = request.querystring;
            var keys = Object.keys(params);
            if (keys.length > 0) {
              var query = [];
              for (var i = 0; i < keys.length; i++) {
                query.push(keys[i] + '=' + params[keys[i]].value);
              }
              location += '?' + query.join('&');
            }
            return {
              statusCode: 301,
              status: 'Found',
              headers: { location: { value: location } }
            };
          }
          return request;
        }
      FunctionConfig:
        Comment: Redirect legacy quiz-cert.com hostnames to the current site domain
        Runtime: cloudfront-js-2.0

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref SiteCustomDomain
          - !Sub www.${SiteCustomDomain}
          - quiz-cert.com
          - www.quiz-cert.com
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: SiteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref SiteOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt LegacyRedirectFunction.FunctionARN
        PriceClass: PriceClass_100
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

Outputs:
  UserPoolId:
    Description: Set VITE_COGNITO_USER_POOL_ID to this value
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Set VITE_COGNITO_CLIENT_ID to this value
    Value: !Ref UserPoolClient
  AwsRegion:
    Description: Set VITE_AWS_REGION to this value
    Value: !Ref AWS::Region
  SyncApiUrl:
    Description: >-
      Set VITE_SYNC_API_URL to this value (include the /sync path). The API is
      already configured with the Cognito authorizer from this stack.
    Value: !Sub https://${SyncApi}.execute-api.${AWS::Region}.amazonaws.com/sync
  SiteUrl:
    Description: Public URL of the deployed web app (matches the AllowOrigins CORS configuration)
    Value: !Sub https://${SiteCustomDomain}
  SiteBucketName:
    Description: S3 bucket to upload dist/ contents to
    Value: !Ref SiteBucket
  SiteDistributionId:
    Description: CloudFront distribution ID for cache invalidations after site deploys
    Value: !Ref SiteDistribution